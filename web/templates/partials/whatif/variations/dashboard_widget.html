<!-- Variation 2: Dashboard Widget (Embeddable) -->
<!-- Can be included directly in the main dashboard -->

<div
  class="bg-gradient-to-br from-purple-50 via-blue-50 to-cyan-50 rounded-xl shadow-lg border border-purple-200 overflow-hidden"
  x-data="whatIfWidget()"
>
  <!-- Header -->
  <div class="bg-white/80 backdrop-blur-sm px-6 py-4 border-b border-purple-200">
    <div class="flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 bg-gradient-to-br from-purple-500 to-blue-500 rounded-lg flex items-center justify-center">
          <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
          </svg>
        </div>
        <div>
          <h3 class="text-lg font-bold text-gray-900">Wat-als Preview</h3>
          <p class="text-xs text-gray-600">Experimenteer met je situatie</p>
        </div>
      </div>
      <button
        @click="expanded = !expanded"
        class="text-gray-500 hover:text-gray-700 transition-colors"
      >
        <svg class="w-5 h-5 transform transition-transform" :class="{ 'rotate-180': expanded }" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
        </svg>
      </button>
    </div>
  </div>

  <!-- Collapsible Content -->
  <div
    x-show="expanded"
    x-transition:enter="transition ease-out duration-200"
    x-transition:enter-start="opacity-0 transform -translate-y-2"
    x-transition:enter-end="opacity-100 transform translate-y-0"
    class="p-6"
  >
    <form
      id="whatif-widget-form"
      hx-post="/whatif/direct-manipulation/calculate?bsn={{ bsn }}"
      hx-target="#widget-results"
      hx-trigger="input changed delay:400ms from:input"
      hx-indicator="#widget-loading"
    >
      <input type="hidden" name="bsn" value="{{ bsn }}">

      <!-- Quick Adjust Sliders -->
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
        <!-- Left: Controls -->
        <div class="space-y-4">
          <div class="bg-white/70 rounded-lg p-4">
            <div class="flex items-center justify-between mb-2">
              <label class="text-sm font-medium text-gray-700 flex items-center">
                <span class="w-2 h-2 bg-blue-500 rounded-full mr-2"></span>
                Inkomen
              </label>
              <span class="text-base font-bold text-blue-600 tabular-nums" x-text="formatMoney(inkomen_werk)">
                €35.000
              </span>
            </div>
            <input
              type="range"
              name="inkomen_werk"
              min="0"
              max="80000"
              step="1000"
              value="35000"
              x-model="inkomen_werk"
              class="widget-slider"
            >
          </div>

          <div class="bg-white/70 rounded-lg p-4">
            <div class="flex items-center justify-between mb-2">
              <label class="text-sm font-medium text-gray-700 flex items-center">
                <span class="w-2 h-2 bg-green-500 rounded-full mr-2"></span>
                Huur/mnd
              </label>
              <span class="text-base font-bold text-green-600 tabular-nums" x-text="formatMoney(huur_per_maand)">
                €800
              </span>
            </div>
            <input
              type="range"
              name="huur_per_maand"
              min="0"
              max="2000"
              step="25"
              value="800"
              x-model="huur_per_maand"
              class="widget-slider"
            >
          </div>

          <div class="bg-white/70 rounded-lg p-4">
            <div class="flex items-center justify-between mb-2">
              <label class="text-sm font-medium text-gray-700 flex items-center">
                <span class="w-2 h-2 bg-purple-500 rounded-full mr-2"></span>
                Vermogen
              </label>
              <span class="text-base font-bold text-purple-600 tabular-nums" x-text="formatMoney(vermogen)">
                €10.000
              </span>
            </div>
            <input
              type="range"
              name="vermogen"
              min="0"
              max="100000"
              step="1000"
              value="10000"
              x-model="vermogen"
              class="widget-slider"
            >
          </div>
        </div>

        <!-- Right: Live Results -->
        <div class="bg-white/70 rounded-lg p-4">
          <h4 class="text-sm font-semibold text-gray-900 mb-3 flex items-center">
            <svg class="w-4 h-4 mr-2 text-blue-500" fill="currentColor" viewBox="0 0 20 20">
              <path d="M2 11a1 1 0 011-1h2a1 1 0 011 1v5a1 1 0 01-1 1H3a1 1 0 01-1-1v-5zM8 7a1 1 0 011-1h2a1 1 0 011 1v9a1 1 0 01-1 1H9a1 1 0 01-1-1V7zM14 4a1 1 0 011-1h2a1 1 0 011 1v12a1 1 0 01-1 1h-2a1 1 0 01-1-1V4z" />
            </svg>
            Live Impact
          </h4>

          <div id="widget-results" class="space-y-3">
            <div class="text-center py-8 text-gray-400">
              <div class="inline-block animate-pulse" id="widget-loading" style="display: none;">
                <div class="w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mx-auto mb-2"></div>
                <p class="text-xs">Berekenen...</p>
              </div>
              <div id="widget-placeholder">
                <svg class="w-10 h-10 mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
                </svg>
                <p class="text-xs">Pas waarden aan</p>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Quick Tips -->
      <div class="flex items-center justify-between text-xs text-gray-600 bg-white/50 rounded-lg px-4 py-2">
        <span class="flex items-center">
          <svg class="w-4 h-4 mr-1 text-blue-500" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd" />
          </svg>
          Sleep om te experimenteren
        </span>
        <a href="/whatif/direct-manipulation?bsn={{ bsn }}" class="text-blue-600 hover:text-blue-800 font-medium">
          Volledige weergave →
        </a>
      </div>
    </form>
  </div>
</div>

<script>
function whatIfWidget() {
  return {
    expanded: false,
    inkomen_werk: {{ person.get('inkomen_werk', 35000) }},
    huur_per_maand: {{ person.get('huur_per_maand', 800) }},
    vermogen: {{ person.get('vermogen', 10000) }},

    formatMoney(value) {
      return '€' + value.toLocaleString('nl-NL');
    }
  }
}

// Auto-load on expand
document.addEventListener('alpine:init', () => {
  Alpine.data('whatIfWidget', whatIfWidget);
});

htmx.on('#whatif-widget-form', 'htmx:afterRequest', () => {
  document.getElementById('widget-placeholder')?.remove();
});
</script>

<style>
.widget-slider {
  width: 100%;
  height: 6px;
  border-radius: 3px;
  background: linear-gradient(to right, #e5e7eb 0%, #3b82f6 50%, #10b981 100%);
  outline: none;
  appearance: none;
}

.widget-slider::-webkit-slider-thumb {
  appearance: none;
  width: 18px;
  height: 18px;
  background: white;
  border: 3px solid #3b82f6;
  border-radius: 50%;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
  transition: transform 0.1s;
}

.widget-slider::-webkit-slider-thumb:hover {
  transform: scale(1.2);
}

.widget-slider::-moz-range-thumb {
  width: 18px;
  height: 18px;
  background: white;
  border: 3px solid #3b82f6;
  border-radius: 50%;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
  transition: transform 0.1s;
}

.widget-slider::-moz-range-thumb:hover {
  transform: scale(1.2);
}
</style>

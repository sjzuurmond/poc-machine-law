<!-- Variation 4: Modal/Overlay Quick Preview -->
<!-- Trigger button (can be placed anywhere on dashboard) -->
<button
  @click="$dispatch('open-whatif-modal')"
  class="fixed bottom-6 right-6 z-40 bg-gradient-to-r from-purple-600 to-blue-600 text-white px-6 py-4 rounded-full shadow-2xl hover:shadow-3xl transform hover:scale-110 transition-all duration-200 flex items-center space-x-2 group"
>
  <svg class="w-6 h-6 group-hover:animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
  </svg>
  <span class="font-semibold">Wat-als?</span>
</button>

<!-- Modal Overlay -->
<div
  x-data="{
    open: false,
    inkomen_werk: {{ person.get('inkomen_werk', 35000) }},
    huur_per_maand: {{ person.get('huur_per_maand', 800) }},
    vermogen: {{ person.get('vermogen', 10000) }},
    formatMoney(v) { return '€' + v.toLocaleString('nl-NL') }
  }"
  @open-whatif-modal.window="open = true"
  @keydown.escape.window="open = false"
  x-show="open"
  class="fixed inset-0 z-50 overflow-y-auto"
  style="display: none;"
>
  <!-- Backdrop -->
  <div
    x-show="open"
    x-transition:enter="transition ease-out duration-300"
    x-transition:enter-start="opacity-0"
    x-transition:enter-end="opacity-100"
    x-transition:leave="transition ease-in duration-200"
    x-transition:leave-start="opacity-100"
    x-transition:leave-end="opacity-0"
    @click="open = false"
    class="fixed inset-0 bg-black bg-opacity-60 backdrop-blur-sm"
  ></div>

  <!-- Modal Content -->
  <div class="flex items-center justify-center min-h-screen p-4">
    <div
      x-show="open"
      x-transition:enter="transition ease-out duration-300"
      x-transition:enter-start="opacity-0 transform scale-90"
      x-transition:enter-end="opacity-100 transform scale-100"
      x-transition:leave="transition ease-in duration-200"
      x-transition:leave-start="opacity-100 transform scale-100"
      x-transition:leave-end="opacity-0 transform scale-90"
      @click.away="open = false"
      class="relative bg-white rounded-2xl shadow-2xl max-w-4xl w-full max-h-[90vh] overflow-hidden"
    >
      <!-- Header -->
      <div class="bg-gradient-to-r from-purple-600 to-blue-600 px-6 py-5 flex items-center justify-between">
        <div class="flex items-center space-x-3">
          <div class="w-10 h-10 bg-white/20 rounded-lg flex items-center justify-center">
            <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
            </svg>
          </div>
          <div>
            <h2 class="text-2xl font-bold text-white">Wat-als Preview</h2>
            <p class="text-sm text-white/80">Experimenteer snel met je situatie</p>
          </div>
        </div>
        <button
          @click="open = false"
          class="text-white/80 hover:text-white transition-colors"
        >
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <!-- Body -->
      <div class="p-6 overflow-y-auto max-h-[calc(90vh-180px)]">
        <form
          id="modal-whatif-form"
          hx-post="/whatif/direct-manipulation/calculate?bsn={{ bsn }}"
          hx-target="#modal-results"
          hx-trigger="input changed delay:400ms from:input"
          hx-indicator="#modal-loading"
        >
          <input type="hidden" name="bsn" value="{{ bsn }}">

          <!-- Quick Sliders -->
          <div class="space-y-4 mb-6">
            <div class="bg-gradient-to-r from-blue-50 to-blue-100 rounded-xl p-4">
              <div class="flex items-center justify-between mb-3">
                <label class="font-semibold text-gray-700 flex items-center">
                  <svg class="w-5 h-5 mr-2 text-blue-600" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M8.433 7.418c.155-.103.346-.196.567-.267v1.698a2.305 2.305 0 01-.567-.267C8.07 8.34 8 8.114 8 8c0-.114.07-.34.433-.582zM11 12.849v-1.698c.22.071.412.164.567.267.364.243.433.468.433.582 0 .114-.07.34-.433.582a2.305 2.305 0 01-.567.267z" />
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-13a1 1 0 10-2 0v.092a4.535 4.535 0 00-1.676.662C6.602 6.234 6 7.009 6 8c0 .99.602 1.765 1.324 2.246.48.32 1.054.545 1.676.662v1.941c-.391-.127-.68-.317-.843-.504a1 1 0 10-1.51 1.31c.562.649 1.413 1.076 2.353 1.253V15a1 1 0 102 0v-.092a4.535 4.535 0 001.676-.662C13.398 13.766 14 12.991 14 12c0-.99-.602-1.765-1.324-2.246A4.535 4.535 0 0011 9.092V7.151c.391.127.68.317.843.504a1 1 0 101.511-1.31c-.563-.649-1.413-1.076-2.354-1.253V5z" clip-rule="evenodd" />
                  </svg>
                  Inkomen
                </label>
                <span class="text-xl font-bold text-blue-600 tabular-nums" x-text="formatMoney(inkomen_werk)">€35.000</span>
              </div>
              <input
                type="range"
                name="inkomen_werk"
                min="0"
                max="80000"
                step="1000"
                value="35000"
                x-model="inkomen_werk"
                class="modal-slider w-full"
              >
              <div class="flex justify-between text-xs text-gray-600 mt-1">
                <span>€0</span>
                <span>€80k</span>
              </div>
            </div>

            <div class="bg-gradient-to-r from-green-50 to-green-100 rounded-xl p-4">
              <div class="flex items-center justify-between mb-3">
                <label class="font-semibold text-gray-700 flex items-center">
                  <svg class="w-5 h-5 mr-2 text-green-600" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z" />
                  </svg>
                  Huur/mnd
                </label>
                <span class="text-xl font-bold text-green-600 tabular-nums" x-text="formatMoney(huur_per_maand)">€800</span>
              </div>
              <input
                type="range"
                name="huur_per_maand"
                min="0"
                max="2000"
                step="25"
                value="800"
                x-model="huur_per_maand"
                class="modal-slider w-full"
              >
              <div class="flex justify-between text-xs text-gray-600 mt-1">
                <span>€0</span>
                <span>€2k</span>
              </div>
            </div>

            <div class="bg-gradient-to-r from-purple-50 to-purple-100 rounded-xl p-4">
              <div class="flex items-center justify-between mb-3">
                <label class="font-semibold text-gray-700 flex items-center">
                  <svg class="w-5 h-5 mr-2 text-purple-600" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M4 4a2 2 0 00-2 2v4a2 2 0 002 2V6h10a2 2 0 00-2-2H4zm2 6a2 2 0 012-2h8a2 2 0 012 2v4a2 2 0 01-2 2H8a2 2 0 01-2-2v-4zm6 4a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd" />
                  </svg>
                  Vermogen
                </label>
                <span class="text-xl font-bold text-purple-600 tabular-nums" x-text="formatMoney(vermogen)">€10.000</span>
              </div>
              <input
                type="range"
                name="vermogen"
                min="0"
                max="100000"
                step="1000"
                value="10000"
                x-model="vermogen"
                class="modal-slider w-full"
              >
              <div class="flex justify-between text-xs text-gray-600 mt-1">
                <span>€0</span>
                <span>€100k</span>
              </div>
            </div>
          </div>

          <!-- Results -->
          <div class="bg-gray-50 rounded-xl p-4">
            <div class="flex items-center justify-between mb-3">
              <h3 class="font-bold text-gray-900 flex items-center">
                <svg class="w-5 h-5 mr-2 text-blue-600" fill="currentColor" viewBox="0 0 20 20">
                  <path d="M2 11a1 1 0 011-1h2a1 1 0 011 1v5a1 1 0 01-1 1H3a1 1 0 01-1-1v-5zM8 7a1 1 0 011-1h2a1 1 0 011 1v9a1 1 0 01-1 1H9a1 1 0 01-1-1V7zM14 4a1 1 0 011-1h2a1 1 0 011 1v12a1 1 0 01-1 1h-2a1 1 0 01-1-1V4z" />
                </svg>
                Impact
              </h3>
              <div id="modal-loading" class="htmx-indicator text-sm text-gray-500">
                <span class="inline-block animate-pulse">⚡ Berekenen...</span>
              </div>
            </div>

            <div id="modal-results">
              <div class="text-center py-8 text-gray-400">
                <p class="text-sm">Pas de waarden aan om de impact te zien</p>
              </div>
            </div>
          </div>
        </form>
      </div>

      <!-- Footer -->
      <div class="bg-gray-50 px-6 py-4 flex items-center justify-between border-t">
        <a
          href="/whatif/direct-manipulation?bsn={{ bsn }}"
          class="text-sm text-blue-600 hover:text-blue-800 font-medium flex items-center"
        >
          Volledige weergave
          <svg class="w-4 h-4 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
          </svg>
        </a>
        <button
          @click="open = false"
          class="px-4 py-2 bg-gray-200 hover:bg-gray-300 rounded-lg font-medium text-gray-700 transition-colors"
        >
          Sluiten
        </button>
      </div>
    </div>
  </div>
</div>

<script>
// Auto-trigger on modal open
document.addEventListener('alpine:init', () => {
  document.addEventListener('open-whatif-modal', () => {
    setTimeout(() => {
      htmx.trigger('#modal-whatif-form', 'input');
    }, 100);
  });
});
</script>

<style>
.modal-slider {
  height: 8px;
  border-radius: 4px;
  background: linear-gradient(to right, #e5e7eb, #3b82f6);
  outline: none;
  appearance: none;
  cursor: pointer;
}

.modal-slider::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  background: white;
  border: 3px solid #3b82f6;
  border-radius: 50%;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
  transition: transform 0.1s;
}

.modal-slider::-webkit-slider-thumb:hover {
  transform: scale(1.15);
}

.modal-slider::-moz-range-thumb {
  width: 20px;
  height: 20px;
  background: white;
  border: 3px solid #3b82f6;
  border-radius: 50%;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
  transition: transform 0.1s;
}

.modal-slider::-moz-range-thumb:hover {
  transform: scale(1.15);
}
</style>

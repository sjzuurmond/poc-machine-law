<!-- Data Overview Panel -->
<div class="bg-white rounded-lg shadow-lg p-6">
  <div class="mb-6">
    <h2 class="text-2xl font-bold text-gray-900 mb-2">Jouw gegevens</h2>
    <p class="text-gray-600 text-sm">Dit zijn de gegevens die bekend zijn over je situatie</p>
  </div>

  {% for category, items in grouped_data.items() %}
  <div class="mb-6">
    <h3 class="text-lg font-semibold text-gray-800 mb-3 pb-2 border-b border-gray-200">
      {{ category }}
    </h3>

    <div class="space-y-3">
      {% for item in items %}
      <div class="flex items-start justify-between py-2 {% if not loop.last %}border-b border-gray-100{% endif %}">
        <div class="flex-1">
          <div class="flex items-center space-x-2">
            <p class="text-sm font-medium text-gray-700">{{ item.label }}</p>
            {% if item.editable %}
            <span class="inline-flex items-center px-2 py-0.5 rounded text-xs bg-blue-100 text-blue-800">
              Aanpasbaar
            </span>
            {% endif %}
          </div>
          <p class="text-xs text-gray-500 mt-1">
            Bron: {{ item.source }}
          </p>
        </div>
        <div class="text-right ml-4">
          <p class="text-sm font-semibold text-gray-900">{{ item.value }}</p>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
  {% endfor %}

  <!-- Action button -->
  <div class="mt-6 pt-6 border-t border-gray-200">
    <button
      hx-get="/whatif/templates/custom/form?bsn={{ bsn }}"
      hx-target="#scenario-form-container"
      hx-swap="innerHTML"
      class="w-full bg-blue-600 text-white px-6 py-3 rounded-lg font-medium hover:bg-blue-700 focus:ring-4 focus:ring-blue-300 transition-colors flex items-center justify-center space-x-2"
    >
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
      </svg>
      <span>Pas gegevens aan voor een wat-als scenario</span>
    </button>
  </div>
</div>
